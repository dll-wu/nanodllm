name: quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      MKL_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU PyTorch
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          "torch==2.7.1"

      - name: Install package and development tools
        run: python -m pip install --editable ".[dev]"

      - name: Ruff lint
        if: matrix.python-version == '3.12'
        run: ruff check .

      - name: Ruff format check
        if: matrix.python-version == '3.12'
        run: ruff format --check .

      - name: Test
        run: python -m pytest -q

      - name: Verify installed command
        run: nanodllm-pretrain --help

      - name: Prepare portable smoke corpus
        if: matrix.python-version == '3.12'
        run: python scripts/prepare_tiny_corpus.py

      - name: Run one-step CPU smoke
        if: matrix.python-version == '3.12'
        run: >-
          nanodllm-pretrain
          --config recipes/tiny-block.json
          --set train.num_steps=1
          --set train.run_dir=runs/ci-smoke

      - name: Verify smoke outputs
        if: matrix.python-version == '3.12'
        run: |
          test -f runs/ci-smoke/metrics.json
          test -f runs/ci-smoke/model_latest.pt

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU PyTorch
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          "torch==2.7.1"

      - name: Install build validators
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: twine check --strict dist/*

      - name: Verify distribution inventories
        run: python scripts/check_release_dist.py dist

      - name: Verify wheel contents and entry point
        run: |
          python -m pip install dist/*.whl
          python -c "from importlib.metadata import distribution; assert any(ep.name == 'nanodllm-pretrain' and ep.value == 'nanodllm.cli:main' for ep in distribution('nano-dllm').entry_points)"

      - name: Verify wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import nanodllm; print(nanodllm.__file__)"
          nanodllm-pretrain --help
          nanodllm-recipes list --group tiny
          nanodllm-eval --help
          python -m paper.companion --check
