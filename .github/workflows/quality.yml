name: quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      MKL_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU PyTorch
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          "torch==2.7.1"

      - name: Install package and development tools
        run: python -m pip install --editable ".[dev]"

      - name: Ruff lint
        if: matrix.python-version == '3.12'
        run: ruff check .

      - name: Ruff format check
        if: matrix.python-version == '3.12'
        run: ruff format --check .

      - name: Test
        run: python -m pytest -q

      - name: Verify installed command
        run: nanodllm-pretrain --help

      - name: Prepare portable smoke corpus
        if: matrix.python-version == '3.12'
        run: python scripts/prepare_tiny_corpus.py

      - name: Run one-step CPU smoke
        if: matrix.python-version == '3.12'
        run: >-
          nanodllm-pretrain
          --config configs/smoke_byte.json
          --set train.num_steps=1
          --set train.run_dir=runs/ci-smoke

      - name: Verify smoke outputs
        if: matrix.python-version == '3.12'
        run: |
          test -f runs/ci-smoke/metrics.json
          test -f runs/ci-smoke/model_latest.pt

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU PyTorch
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          "torch==2.7.1"

      - name: Install build validators
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: twine check --strict dist/*

      - name: Verify distribution inventories
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          sdist, = Path("dist").glob("*.tar.gz")
          wheel, = Path("dist").glob("*.whl")

          with tarfile.open(sdist, "r:gz") as archive:
              members = [PurePosixPath(name) for name in archive.getnames()]
          roots = {path.parts[0] for path in members if path.parts}
          assert len(roots) == 1, roots
          source = {
              PurePosixPath(*path.parts[1:]).as_posix()
              for path in members
              if len(path.parts) > 1
          }
          required_files = {
              ".github/workflows/quality.yml",
              "AGENTS.md",
              "CITATION.cff",
              "CONTRIBUTING.md",
              "DESIGN_DECISIONS.md",
              "LICENSE",
              "MANIFEST.in",
              "README.md",
              "SECURITY.md",
              "THIRD_PARTY_NOTICES.md",
              "examples/tiny_corpus.txt",
              "pretrain.py",
              "pyproject.toml",
          }
          assert required_files <= source, sorted(required_files - source)
          source_groups = {
              "configs": "*.json",
              "docs": "*.md",
              "examples": "*.txt",
              "nanodllm": "*.py",
              "scripts": "*.py",
              "tests": "*.py",
          }
          for directory, pattern in source_groups.items():
              expected = {
                  path.as_posix()
                  for path in Path(directory).rglob(pattern)
                  if path.is_file()
              }
              assert expected, (directory, pattern)
              assert expected <= source, sorted(expected - source)

          forbidden_parts = {
              ".mypy_cache",
              ".pytest_cache",
              ".ruff_cache",
              ".venv",
              "__pycache__",
              "build",
              "data",
              "dist",
              "reports",
              "results",
              "runs",
              "venv",
          }
          forbidden_source = sorted(
              name
              for name in source
              if forbidden_parts.intersection(PurePosixPath(name).parts)
          )
          assert not forbidden_source, forbidden_source

          with zipfile.ZipFile(wheel) as archive:
              wheel_files = set(archive.namelist())
          expected_wheel_code = {"pretrain.py"} | {
              path.as_posix() for path in Path("nanodllm").rglob("*.py")
          }
          assert expected_wheel_code <= wheel_files, sorted(
              expected_wheel_code - wheel_files
          )
          forbidden_wheel_prefixes = ("configs/", "docs/", "examples/", "scripts/", "tests/")
          assert not any(
              name.startswith(forbidden_wheel_prefixes) for name in wheel_files
          ), sorted(wheel_files)
          assert not {
              "AGENTS.md",
              "CITATION.cff",
              "CONTRIBUTING.md",
              "DESIGN_DECISIONS.md",
              "README.md",
              "SECURITY.md",
              "THIRD_PARTY_NOTICES.md",
          }.intersection(wheel_files)
          PY

      - name: Verify wheel contents and entry point
        run: |
          python -m pip install dist/*.whl
          python -c "from importlib.metadata import distribution; assert any(ep.name == 'nanodllm-pretrain' and ep.value == 'nanodllm.cli:main' for ep in distribution('nano-dllm').entry_points)"

      - name: Verify wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import nanodllm; print(nanodllm.__file__)"
          nanodllm-pretrain --help
