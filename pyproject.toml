[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-dllm"
version = "1.0.0rc1"
description = "Research code for training masked discrete diffusion language models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "nano-dllm contributors" },
]
keywords = [
    "diffusion language models",
    "language modeling",
    "machine learning",
    "masked diffusion",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pyarrow>=21.0.0",
    "tensorboard>=2.18.0",
    "tokenizers>=0.21.0",
    "torch>=2.7.1",
    "transformers>=4.51.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pytest>=8.0.0",
    "ruff>=0.15.0",
    "setuptools>=77",
    "twine>=6.1.0",
]

[project.scripts]
nanodllm-pretrain = "nanodllm.cli:main"
nanodllm-generate = "nanodllm.generation.cli:main"
nanodllm-eval = "nanodllm.evaluation.cli:main"
nanodllm-tasks = "nanodllm.tasks.cli:main"
nanodllm-export-weights = "nanodllm.weights:main"
nanodllm-recipes = "recipes.launch:main"
nanodllm-components = "recipes.components.__main__:main"

[tool.setuptools]
py-modules = ["pretrain"]
include-package-data = false

[tool.setuptools.cmdclass]
sdist = "scripts.release_sdist.PublicSdist"

[tool.setuptools.packages.find]
include = ["nanodllm", "nanodllm.*", "recipes", "recipes.*", "paper", "paper.*"]
namespaces = false

[tool.setuptools.package-data]
"nanodllm.runtime" = ["vendor/nanochat/LICENSE", "vendor/nanochat/nanochat/optim.py"]
"recipes" = ["*.json", "profiles/*.json", "preview/*.json"]
"recipes.components" = ["*.json"]
"paper" = ["profiles/*.json", "panels/*.json", "tasks/*.json"]
"paper.companion" = ["data/*.json", "data/task-draws.npz", "manifest.json", "templates/**/*.tex", "templates/*.tex"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["nanodllm/runtime/vendor"]
target-version = "py310"
line-length = 120
src = ["nanodllm"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = [
    "E501",
]
