version = 1

[repository]
inventory = "git-visible"
encoding = "utf-8"
follow_symlinks = false

[output]
default_format = "text"
stable_sort = true

[[file_rule]]
name = "paper-evaluation-data"
patterns = ["paper/companion/data/*.json", "paper/panels/corpus-v1.json"]
kind = "fixture"
scan = false
reason = "Frozen numerical observations and corpus selection records are inputs to paper reproduction."

[[file_rule]]
name = "authored"
patterns = ["**"]
kind = "authored"
scan = true
warn_bytes = 20480
hard_bytes = 25600

[documentation]
roots = ["docs/index.md"]
exclude = []
require_directory_indexes = false
require_sibling_links = false
require_child_index_links = false
require_root_reachability = false
check_local_targets = true
check_fragments = true
allow_authored_symlinks = false

[ratchet]
compare_file_sizes = true
forbid_new_oversize = true
forbid_limit_increases = true
forbid_exclusion_expansion = true
forbid_removed_documentation_roots = true
forbid_removed_entrypoint_targets = true

[exceptions]
require_reason = true
require_owner = true
require_tracking_reference = true
allow_expired = false
